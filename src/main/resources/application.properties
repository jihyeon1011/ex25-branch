spring.application.name=ex25-branch

server.port=8085

# DB연결
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/testdb
spring.datasource.username=root
spring.datasource.password=1234

# Mybatis 설정
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.cjh.ex25_branch.domain
# [createdAt == created_at] 자동연결
mybatis.configuration.map-underscore-to-camel-case=true

# mybatis를 이용해서, 쿼리 콘솔에 찍기(테이블 값, 쿼리문)
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 로깅레벨을 이용해서, 쿼리를 콘솔에 찍기(쿼리문)
#logging.level.com.cjh.ex25_branch.mapper=debug